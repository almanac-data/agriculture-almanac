id: fews-net
type: dataset
title: FEWS NET Food Security Data and Analysis
description: |
  The Famine Early Warning Systems Network's monitoring and projections of acute food insecurity: IPC-compatible food insecurity classifications by country and period, with markets and trade, agroclimatology, livelihood zone and boundary data, for the countries most at risk of famine.
publisher: Famine Early Warning Systems Network (FEWS NET)
jurisdiction:
  scope: national
  country: US
