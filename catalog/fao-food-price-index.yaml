id: fao-food-price-index
type: dataset
title: FAO Food Price Index
description: |
  FAO's monthly measure of change in international prices of a basket of food commodities: the trade-weighted average of five commodity group indices (cereals, vegetable oils, dairy, meat, sugar), in nominal and real terms.
publisher: Food and Agriculture Organization of the United Nations (FAO)
jurisdiction:
  scope: multilateral
  country: null
topics:
- prices
- food-security
- markets
- global
source:
