id: usda-nass-quick-stats
type: dataset
title: USDA NASS Quick Stats
description: |
  The National Agricultural Statistics Service's online database of official published aggregate estimates for U.S. agricultural production — crops, livestock, prices, demographics, and economics — at national, state, and county level, including Census of Agriculture results.
publisher: U.S. Department of Agriculture, National Agricultural Statistics Service (USDA NASS)
jurisdiction:
  scope: national
  country: US
topics:
- production
- crops
- livestock
- prices
- county-level
source:
  canonical_url: https://quickstats.nass.usda.gov/
access:
  method:
  - web
  - api
  - bulk
  auth_required: false
  auth_note: Web query tool is open; the Quick Stats API requires a free API key requested from the site.
  rate_limit: API returns at most 50,000 records per request (documented on the API page).
format:
- csv
- json
- xml
status: live
status_since: '2026-10-31'
status_source: curator
observed:
  checked: '2026-10-31'
  reachable: null
  http_status: null
  final_url: null
coverage:
  spatial: United States (national, state, county; some sub-state districts)
  temporal: varies by series (historical series back to the 1800s for some commodities)
  cadence: event
license: public-domain (US Gov work)
attribution: USDA National Agricultural Statistics Service, Quick Stats
notes: |
  Human-verified 2026-10-31: site and API documentation page load (HTTP 200 via curl). API page documents the free key and the 50,000-record limit per call.
  Updated as each NASS report is released, so cadence is recorded as event.
